<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img" aria-labelledby="lang-title">
  <title id="lang-title">Most used languages (by commits)</title>
  <desc>Python 46.8%, TypeScript 26.5%, SQL 9.4%, R 6.8%, Shell 4.5%, Jupyter Notebook 3.8%, Other 2.2%</desc>
  <defs>
    <clipPath id="ps-clip-lg"><rect width="1200" height="208" rx="20"/></clipPath>
    <radialGradient id="ps-glow-lg" cx="0" cy="0" r="0.9">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lg-bar"><rect x="40" y="80" width="1120" height="16" rx="8"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <g clip-path="url(#ps-clip-lg)">
    <rect width="1200" height="208" fill="#11141D"/>
    <rect width="1200" height="208" fill="url(#ps-glow-lg)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="207" rx="20" fill="none" stroke="#232838"/>

  <!-- Header -->
  <text x="40" y="54" class="mono" font-size="12" font-weight="700" letter-spacing="1.4" fill="#3EC6E0">LANGUAGES · WEIGHTED BY COMMITS</text>
  <text x="1160" y="54" text-anchor="end" class="mono" font-size="12" letter-spacing="1.4" fill="#8B93A7">8 LANGUAGES · LAST 12 MONTHS</text>

  <!-- Segmented Bar (1120px total) -->
  <g clip-path="url(#lg-bar)">
    <!-- Python (46.8% = 524px) -->
    <rect x="40" y="80" width="524" height="16" fill="#3572A5"/>
    <!-- TypeScript (26.5% = 297px) -->
    <rect x="564" y="80" width="297" height="16" fill="#3178C6"/>
    <!-- SQL (9.4% = 105px) -->
    <rect x="861" y="80" width="105" height="16" fill="#E38C00"/>
    <!-- R (6.8% = 76px) -->
    <rect x="966" y="80" width="76" height="16" fill="#198CE7"/>
    <!-- Shell (4.5% = 50px) -->
    <rect x="1042" y="80" width="50" height="16" fill="#89E051"/>
    <!-- Jupyter (3.8% = 43px) -->
    <rect x="1092" y="80" width="43" height="16" fill="#DA5B0B"/>
    <!-- Other (2.2% = 25px) -->
    <rect x="1135" y="80" width="25" height="16" fill="#6B7280"/>
  </g>

  <!-- Legend Row 1 -->
  <g transform="translate(40, 134)" class="mono" font-size="12.5">
    <!-- Python -->
    <circle cx="6" cy="-4" r="5" fill="#3572A5"/>
    <text x="18" y="0" fill="#E6E8F0" font-weight="600">Python <tspan fill="#8B93A7" font-weight="400">46.8%</tspan></text>

    <!-- TypeScript -->
    <g transform="translate(190, 0)">
      <circle cx="6" cy="-4" r="5" fill="#3178C6"/>
      <text x="18" y="0" fill="#E6E8F0" font-weight="600">TypeScript <tspan fill="#8B93A7" font-weight="400">26.5%</tspan></text>
    </g>

    <!-- SQL -->
    <g transform="translate(410, 0)">
      <circle cx="6" cy="-4" r="5" fill="#E38C00"/>
      <text x="18" y="0" fill="#E6E8F0" font-weight="600">SQL <tspan fill="#8B93A7" font-weight="400">9.4%</tspan></text>
    </g>

    <!-- R -->
    <g transform="translate(560, 0)">
      <circle cx="6" cy="-4" r="5" fill="#198CE7"/>
      <text x="18" y="0" fill="#E6E8F0" font-weight="600">R <tspan fill="#8B93A7" font-weight="400">6.8%</tspan></text>
    </g>

    <!-- Shell -->
    <g transform="translate(680, 0)">
      <circle cx="6" cy="-4" r="5" fill="#89E051"/>
      <text x="18" y="0" fill="#E6E8F0" font-weight="600">Shell <tspan fill="#8B93A7" font-weight="400">4.5%</tspan></text>
    </g>

    <!-- Jupyter Notebook -->
    <g transform="translate(830, 0)">
      <circle cx="6" cy="-4" r="5" fill="#DA5B0B"/>
      <text x="18" y="0" fill="#E6E8F0" font-weight="600">Jupyter Notebook <tspan fill="#8B93A7" font-weight="400">3.8%</tspan></text>
    </g>

    <!-- Other -->
    <g transform="translate(1040, 0)">
      <circle cx="6" cy="-4" r="5" fill="#6B7280"/>
      <text x="18" y="0" fill="#E6E8F0" font-weight="600">Other <tspan fill="#8B93A7" font-weight="400">2.2%</tspan></text>
    </g>
  </g>
</svg>
