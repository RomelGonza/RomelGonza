<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-labelledby="r1-title">
  <title id="r1-title">Predicción de Heladas con Modelos Ensemble Multi-Horizonte</title>
  <defs>
    <clipPath id="r1-clip"><rect width="400" height="200" rx="16"/></clipPath>
    <radialGradient id="r1-glow" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <g clip-path="url(#r1-clip)">
    <rect width="400" height="200" fill="#11141D"/>
    <rect width="400" height="200" fill="url(#r1-glow)"/>
    <rect width="400" height="3" fill="url(#r1-accent)"/>
  </g>

  <!-- Top Category & Tag Pill -->
  <text x="24" y="38" class="mono" font-size="11" font-weight="700" letter-spacing="1.4" fill="#34d399">RESEARCH · AI</text>
  <rect x="268" y="23" width="108" height="22" rx="11" fill="#171B28" stroke="#232838"/>
  <text x="322" y="38" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#38bdf8">Scopus / SciELO</text>

  <!-- Title -->
  <text x="24" y="70" class="sans" font-size="17" font-weight="700" fill="#E6E8F0" letter-spacing="-0.3">
    prediccion-heladas-ensemble
  </text>

  <!-- Description -->
  <text x="24" y="98" class="sans" font-size="12.5" fill="#8B93A7">Modelos ensemble predictivos multi-horizonte</text>
  <text x="24" y="117" class="sans" font-size="12.5" fill="#8B93A7">(Random Forest, XGBoost, LightGBM) sobre</text>
  <text x="24" y="136" class="sans" font-size="12.5" fill="#8B93A7">10 años de series agroclimáticas del Altiplano.</text>

  <!-- Bottom Divider & Meta -->
  <line x1="24" y1="156" x2="376" y2="156" stroke="#232838"/>
  <circle cx="30" cy="176" r="5" fill="#3572A5"/>
  <text x="42" y="180" class="mono" font-size="12" fill="#E6E8F0">Python</text>

  <text x="140" y="180" class="mono" font-size="11" fill="#34d399">★ 1st Author</text>
  <text x="376" y="180" text-anchor="end" class="mono" font-size="11" fill="#8B93A7">DOI: 10.18271</text>

  <rect x=".5" y=".5" width="399" height="199" rx="16" fill="none" stroke="#232838"/>
</svg>
