<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 24" width="100%" height="24" fill="none">
  <defs>
    <linearGradient id="div-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow-diamond" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left & Right Tapered Axis -->
  <line x1="40" y1="12" x2="920" y2="12" stroke="url(#div-line)" stroke-width="1" />

  <!-- Center Diamond & Rings -->
  <g transform="translate(480, 12)">
    <circle cx="0" cy="0" r="8" fill="#10b981" fill-opacity="0.08" />
    <circle cx="0" cy="0" r="4" fill="#09090b" stroke="#10b981" stroke-width="1.2" filter="url(#glow-diamond)" />
    <circle cx="0" cy="0" r="1.5" fill="#38bdf8" />
    
    <!-- Micro companion ticks -->
    <circle cx="-24" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.5" />
    <circle cx="24" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.5" />
  </g>
</svg>
