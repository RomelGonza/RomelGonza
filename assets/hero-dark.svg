<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Romel Gonzalo Quispe Valero — Data Scientist &amp; Software Architect</title>
  <desc>Big Data Distribuido · Machine Learning &amp; AI · Full-Stack Cloud Architect</desc>
  <defs>
    <clipPath id="h-clip">
      <rect width="1200" height="400" rx="20"/>
    </clipPath>
    <linearGradient id="h-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="orb-emerald" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-sky" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="h-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Base Plate & Clip -->
  <g clip-path="url(#h-clip)">
    <rect width="1200" height="400" fill="#0c0e15"/>
    <rect width="1200" height="400" fill="url(#h-grid)"/>
    <rect width="1200" height="400" fill="url(#orb-emerald)"/>
    <rect width="1200" height="400" fill="url(#orb-sky)"/>
    <!-- Top Accent Gradient Stripe -->
    <rect width="1200" height="4" fill="url(#h-bar)"/>
  </g>

  <!-- Outer Structural Border -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="19.5" stroke="#232838" stroke-width="1"/>

  <!-- Content Layout -->
  <g transform="translate(64, 48)">
    <!-- Top Pill: Status & Identity -->
    <g transform="translate(0, 0)">
      <rect width="470" height="30" rx="15" fill="#141824" stroke="#283046" stroke-width="1"/>
      <circle cx="16" cy="15" r="4.5" fill="#10b981" filter="url(#soft-glow)"/>
      <circle cx="16" cy="15" r="3" fill="#34d399"/>
      <text x="30" y="19" fill="#38bdf8" font-size="11" font-weight="700" class="mono" letter-spacing="1.2">
        DATA SCIENTIST &amp; SOFTWARE ARCHITECT
      </text>
      <text x="355" y="19" fill="#94a3b8" font-size="11" class="mono">
        · PERÚ (GMT-5)
      </text>
    </g>

    <!-- Headline Name -->
    <g transform="translate(0, 84)">
      <text x="0" y="0" fill="#f8fafc" font-size="44" font-weight="800" class="sans" letter-spacing="-1">
        Romel Gonzalo Quispe Valero
      </text>
    </g>

    <!-- Professional Focus & Specialization -->
    <g transform="translate(0, 122)">
      <text x="0" y="0" fill="#38bdf8" font-size="16.5" font-weight="600" class="sans">
        Distributed Big Data (PySpark) <tspan fill="#64748b">·</tspan> Machine Learning (Scopus) <tspan fill="#64748b">·</tspan> Full-Stack Cloud (Next.js, Supabase)
      </text>
      <text x="0" y="28" fill="#94a3b8" font-size="14.5" class="sans">
        Diseñando sistemas robustos de alto rendimiento, procesamiento distribuido en clúster y modelos predictivos aplicados.
      </text>
    </g>

    <!-- Key Credential Chips (Bottom Row) -->
    <g transform="translate(0, 226)">
      <!-- NASA Space Apps 2024 -->
      <g transform="translate(0, 0)">
        <rect width="235" height="38" rx="10" fill="#131722" stroke="#232838" stroke-width="1"/>
        <text x="14" y="17" fill="#fbbf24" font-size="10" font-weight="700" class="mono">★ NASA SPACE APPS 2024</text>
        <text x="14" y="30" fill="#cbd5e1" font-size="11" class="sans">Galactic Problem Solver</text>
      </g>

      <!-- ICPC South America Finals -->
      <g transform="translate(250, 0)">
        <rect width="235" height="38" rx="10" fill="#131722" stroke="#232838" stroke-width="1"/>
        <text x="14" y="17" fill="#38bdf8" font-size="10" font-weight="700" class="mono">▲ ICPC SOUTH AMERICA</text>
        <text x="14" y="30" fill="#cbd5e1" font-size="11" class="sans">Mención Honrosa 2024</text>
      </g>

      <!-- Scopus Author -->
      <g transform="translate(500, 0)">
        <rect width="245" height="38" rx="10" fill="#131722" stroke="#232838" stroke-width="1"/>
        <text x="14" y="17" fill="#10b981" font-size="10" font-weight="700" class="mono">◆ SCOPUS / SCIELO RESEARCH</text>
        <text x="14" y="30" fill="#cbd5e1" font-size="11" class="sans">Primer Autor (Ensemble ML)</text>
      </g>

      <!-- UNI PIT 20/20 -->
      <g transform="translate(760, 0)">
        <rect width="215" height="38" rx="10" fill="#131722" stroke="#232838" stroke-width="1"/>
        <text x="14" y="17" fill="#c084fc" font-size="10" font-weight="700" class="mono">● BIG DATA &amp; LLMS (UNI)</text>
        <text x="14" y="30" fill="#cbd5e1" font-size="11" class="sans">Nota Perfecta (20/20)</text>
      </g>
    </g>
  </g>

  <!-- Right Side Monogram -->
  <g transform="translate(1090, 48)">
    <rect width="46" height="46" rx="12" fill="#141824" stroke="#283046" stroke-width="1"/>
    <text x="23" y="29" fill="#10b981" font-size="15" font-weight="800" class="mono" text-anchor="middle">RG</text>
  </g>
</svg>
