<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" fill="none" role="img" aria-labelledby="stack-title-light">
  <title id="stack-title-light">Romel Gonzalo Quispe Valero — Core Tech Stack</title>
  <defs>
    <clipPath id="st-clip-light"><rect width="960" height="280" rx="16"/></clipPath>
    <radialGradient id="st-glow-light" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st-accent-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .cat-title { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .chip-text { font-size: 12px; font-weight: 500; fill: #1e293b; }
  </style>

  <g clip-path="url(#st-clip-light)">
    <rect width="960" height="280" fill="#f8fafc"/>
    <rect width="960" height="280" fill="url(#st-glow-light)"/>
    <rect width="960" height="3" fill="url(#st-accent-light)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="279" rx="16" fill="none" stroke="#e2e8f0"/>

  <!-- Row 1: Languages & Big Data -->
  <g transform="translate(32, 34)">
    <!-- Languages -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="mono cat-title" fill="#0284c7">01 // LANGUAGES &amp; CORE</text>
      <g transform="translate(0, 14)">
        <rect width="896" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="16" y="22" class="mono chip-text">
          <tspan fill="#059669">●</tspan> Python &nbsp;·&nbsp;
          <tspan fill="#0284c7">●</tspan> TypeScript &nbsp;·&nbsp;
          <tspan fill="#d97706">●</tspan> JavaScript &nbsp;·&nbsp;
          <tspan fill="#2563eb">●</tspan> R &nbsp;·&nbsp;
          <tspan fill="#e11d48">●</tspan> SQL &nbsp;·&nbsp;
          <tspan fill="#7c3aed">●</tspan> C++ &nbsp;·&nbsp;
          <tspan fill="#64748b">●</tspan> Bash
        </text>
      </g>
    </g>

    <!-- Big Data & Distributed -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" class="mono cat-title" fill="#d97706">02 // BIG DATA &amp; DISTRIBUTED PIPELINES</text>
      <g transform="translate(0, 14)">
        <rect width="896" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="16" y="22" class="mono chip-text">
          <tspan fill="#d97706">●</tspan> PySpark &nbsp;·&nbsp;
          <tspan fill="#d97706">●</tspan> Apache Spark &nbsp;·&nbsp;
          <tspan fill="#0284c7">●</tspan> SparkSQL &nbsp;·&nbsp;
          <tspan fill="#059669">●</tspan> Catalyst Optimizer &nbsp;·&nbsp;
          <tspan fill="#eab308">●</tspan> Hadoop &nbsp;·&nbsp;
          <tspan fill="#7c3aed">●</tspan> Parquet Columnar Storage
        </text>
      </g>
    </g>

    <!-- Machine Learning & FullStack -->
    <g transform="translate(0, 156)">
      <text x="0" y="0" class="mono cat-title" fill="#059669">03 // MACHINE LEARNING &amp; CLOUD ARCHITECTURE</text>
      <g transform="translate(0, 14)">
        <rect width="896" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="16" y="22" class="mono chip-text">
          <tspan fill="#059669">●</tspan> Scikit-Learn &nbsp;·&nbsp;
          <tspan fill="#0284c7">●</tspan> XGBoost &nbsp;·&nbsp;
          <tspan fill="#047857">●</tspan> Random Forest &nbsp;·&nbsp;
          <tspan fill="#0f172a">●</tspan> Next.js 15 &nbsp;·&nbsp;
          <tspan fill="#0284c7">●</tspan> Supabase (RLS/Auth) &nbsp;·&nbsp;
          <tspan fill="#2563eb">●</tspan> PostgreSQL &nbsp;·&nbsp;
          <tspan fill="#0284c7">●</tspan> Docker
        </text>
      </g>
    </g>
  </g>
</svg>
