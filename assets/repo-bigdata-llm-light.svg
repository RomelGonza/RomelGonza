<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-labelledby="r2-title-light">
  <title id="r2-title-light">Pipeline Distribuido de Big Data y Curación para LLMs</title>
  <defs>
    <clipPath id="r2-clip-light"><rect width="400" height="200" rx="16"/></clipPath>
    <radialGradient id="r2-glow-light" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r2-accent-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <g clip-path="url(#r2-clip-light)">
    <rect width="400" height="200" fill="#f8fafc"/>
    <rect width="400" height="200" fill="url(#r2-glow-light)"/>
    <rect width="400" height="3" fill="url(#r2-accent-light)"/>
  </g>

  <!-- Top Category & Tag Pill -->
  <text x="24" y="38" class="mono" font-size="11" font-weight="700" letter-spacing="1.4" fill="#0284c7">BIG DATA · CLOUD</text>
  <rect x="278" y="23" width="98" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="327" y="38" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#6366f1">UNI PIT 20/20</text>

  <!-- Title -->
  <text x="24" y="70" class="sans" font-size="17" font-weight="700" fill="#0f172a" letter-spacing="-0.3">
    pyspark-llm-data-pipeline
  </text>

  <!-- Description -->
  <text x="24" y="98" class="sans" font-size="12.5" fill="#475569">Pipeline distribuido y escalable con PySpark</text>
  <text x="24" y="117" class="sans" font-size="12.5" fill="#475569">para tokenización, deduplicación y curación</text>
  <text x="24" y="136" class="sans" font-size="12.5" fill="#475569">de datasets masivos para entrenamiento LLM.</text>

  <!-- Bottom Divider & Meta -->
  <line x1="24" y1="156" x2="376" y2="156" stroke="#e2e8f0"/>
  <circle cx="30" cy="176" r="5" fill="#E25A1C"/>
  <text x="42" y="180" class="mono" font-size="12" fill="#0f172a">PySpark</text>

  <text x="140" y="180" class="mono" font-size="11" fill="#0284c7">● Parquet / SQL</text>
  <text x="376" y="180" text-anchor="end" class="mono" font-size="11" fill="#6366f1">Grade: 20/20</text>

  <rect x=".5" y=".5" width="399" height="199" rx="16" fill="none" stroke="#e2e8f0"/>
</svg>
