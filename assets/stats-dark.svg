<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="351" viewBox="0 0 1200 351" role="img" aria-labelledby="stats-title">
  <title id="stats-title">Romel's GitHub stats: 1,428 contributions in the last 12 months</title>
  <defs>
    <clipPath id="st-clip"><rect width="1200" height="351" rx="20"/></clipPath>
    <radialGradient id="st-glow" cx="0.08" cy="0" r="0.9">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <g clip-path="url(#st-clip)">
    <rect width="1200" height="351" fill="#11141D"/>
    <rect width="1200" height="351" fill="url(#st-glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="350" rx="20" fill="none" stroke="#232838"/>

  <!-- ── LEFT SIDE: STATS & TILES ── -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" class="mono" font-size="12" font-weight="700" letter-spacing="1.4" fill="#3EC6E0">ACTIVITY · LAST 12 MONTHS</text>
    
    <g transform="translate(0, 48)">
      <text x="0" y="0" class="sans" font-size="46" font-weight="800" fill="#38BDF8" letter-spacing="-1">1,428</text>
      <text x="145" y="-6" class="sans" font-size="16" font-weight="500" fill="#8B93A7">contributions</text>
    </g>

    <!-- 6 Tiles (2 rows x 3 cols) -->
    <g transform="translate(0, 78)">
      <!-- Row 1 -->
      <!-- Tile 1: Current Streak -->
      <g transform="translate(0, 0)">
        <rect width="170" height="68" rx="12" fill="#161A26" stroke="#232838"/>
        <text x="16" y="24" class="mono" font-size="10.5" fill="#38bdf8">⚡ CURRENT STREAK</text>
        <text x="16" y="50" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">1 <tspan font-size="12" font-weight="400" fill="#8B93A7">day</tspan></text>
      </g>

      <!-- Tile 2: Longest Streak -->
      <g transform="translate(182, 0)">
        <rect width="170" height="68" rx="12" fill="#161A26" stroke="#232838"/>
        <text x="16" y="24" class="mono" font-size="10.5" fill="#10b981">🏆 LONGEST STREAK</text>
        <text x="16" y="50" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">24 <tspan font-size="12" font-weight="400" fill="#8B93A7">days</tspan></text>
      </g>

      <!-- Tile 3: Commits -->
      <g transform="translate(364, 0)">
        <rect width="170" height="68" rx="12" fill="#161A26" stroke="#232838"/>
        <text x="16" y="24" class="mono" font-size="10.5" fill="#818cf8">⎇ COMMITS</text>
        <text x="16" y="50" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">312 <tspan font-size="12" font-weight="400" fill="#8B93A7">past year</tspan></text>
      </g>

      <!-- Row 2 -->
      <!-- Tile 4: All-Time -->
      <g transform="translate(0, 80)">
        <rect width="170" height="68" rx="12" fill="#161A26" stroke="#232838"/>
        <text x="16" y="24" class="mono" font-size="10.5" fill="#38bdf8">✦ ALL-TIME</text>
        <text x="16" y="50" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">1,428 <tspan font-size="12" font-weight="400" fill="#8B93A7">since 2023</tspan></text>
      </g>

      <!-- Tile 5: Best Week -->
      <g transform="translate(182, 80)">
        <rect width="170" height="68" rx="12" fill="#161A26" stroke="#232838"/>
        <text x="16" y="24" class="mono" font-size="10.5" fill="#10b981">📊 BEST WEEK</text>
        <text x="16" y="50" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">142 <tspan font-size="12" font-weight="400" fill="#8B93A7">in 7 days</tspan></text>
      </g>

      <!-- Tile 6: On GitHub -->
      <g transform="translate(364, 80)">
        <rect width="170" height="68" rx="12" fill="#161A26" stroke="#232838"/>
        <text x="16" y="24" class="mono" font-size="10.5" fill="#a78bfa">⏱ ON GITHUB</text>
        <text x="16" y="50" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">3 <tspan font-size="12" font-weight="400" fill="#8B93A7">years</tspan></text>
      </g>
    </g>
  </g>

