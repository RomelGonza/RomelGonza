<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img" aria-labelledby="lang-title-l">
  <title id="lang-title-l">Most used languages (by commits)</title>
  <desc>Python 46.8%, TypeScript 26.5%, SQL 9.4%, R 6.8%, Shell 4.5%, Jupyter Notebook 3.8%, Other 2.2%</desc>
  <defs>
    <clipPath id="ps-clip-lg-l"><rect width="1200" height="208" rx="20"/></clipPath>
    <radialGradient id="ps-glow-lg-l" cx="0" cy="0" r="0.9">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lg-bar-l"><rect x="40" y="80" width="1120" height="16" rx="8"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <g clip-path="url(#ps-clip-lg-l)">
    <rect width="1200" height="208" fill="#f8fafc"/>
    <rect width="1200" height="208" fill="url(#ps-glow-lg-l)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="207" rx="20" fill="none" stroke="#e2e8f0"/>

  <!-- Header -->
  <text x="40" y="54" class="mono" font-size="12" font-weight="700" letter-spacing="1.4" fill="#0284c7">LANGUAGES · WEIGHTED BY COMMITS</text>
  <text x="1160" y="54" text-anchor="end" class="mono" font-size="12" letter-spacing="1.4" fill="#64748b">8 LANGUAGES · LAST 12 MONTHS</text>

  <!-- Segmented Bar (1120px total) -->
  <g clip-path="url(#lg-bar-l)">
    <rect x="40" y="80" width="524" height="16" fill="#3572A5"/>
    <rect x="564" y="80" width="297" height="16" fill="#3178C6"/>
    <rect x="861" y="80" width="105" height="16" fill="#E38C00"/>
    <rect x="966" y="80" width="76" height="16" fill="#198CE7"/>
    <rect x="1042" y="80" width="50" height="16" fill="#89E051"/>
    <rect x="1092" y="80" width="43" height="16" fill="#DA5B0B"/>
    <rect x="1135" y="80" width="25" height="16" fill="#94A3B8"/>
  </g>

  <!-- Legend Row 1 -->
  <g transform="translate(40, 134)" class="mono" font-size="12.5">
    <circle cx="6" cy="-4" r="5" fill="#3572A5"/>
    <text x="18" y="0" fill="#0f172a" font-weight="600">Python <tspan fill="#64748b" font-weight="400">46.8%</tspan></text>

    <g transform="translate(190, 0)">
      <circle cx="6" cy="-4" r="5" fill="#3178C6"/>
      <text x="18" y="0" fill="#0f172a" font-weight="600">TypeScript <tspan fill="#64748b" font-weight="400">26.5%</tspan></text>
    </g>

    <g transform="translate(410, 0)">
      <circle cx="6" cy="-4" r="5" fill="#E38C00"/>
      <text x="18" y="0" fill="#0f172a" font-weight="600">SQL <tspan fill="#64748b" font-weight="400">9.4%</tspan></text>
    </g>

    <g transform="translate(560, 0)">
      <circle cx="6" cy="-4" r="5" fill="#198CE7"/>
      <text x="18" y="0" fill="#0f172a" font-weight="600">R <tspan fill="#64748b" font-weight="400">6.8%</tspan></text>
    </g>

    <g transform="translate(680, 0)">
      <circle cx="6" cy="-4" r="5" fill="#89E051"/>
      <text x="18" y="0" fill="#0f172a" font-weight="600">Shell <tspan fill="#64748b" font-weight="400">4.5%</tspan></text>
    </g>

    <g transform="translate(830, 0)">
      <circle cx="6" cy="-4" r="5" fill="#DA5B0B"/>
      <text x="18" y="0" fill="#0f172a" font-weight="600">Jupyter Notebook <tspan fill="#64748b" font-weight="400">3.8%</tspan></text>
    </g>

    <g transform="translate(1040, 0)">
      <circle cx="6" cy="-4" r="5" fill="#94A3B8"/>
      <text x="18" y="0" fill="#0f172a" font-weight="600">Other <tspan fill="#64748b" font-weight="400">2.2%</tspan></text>
    </g>
  </g>
</svg>
